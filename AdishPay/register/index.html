<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdishPay Register</title>
    <link rel="stylesheet" href="register.css">
    <link rel="icon" type="image/png" href="../images/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">    
  </head>
<body>
    <h1 class="logo">
    <span class="adish">Adish</span><span class="pay">Pay</span>
</h1>
    <h3>Secure Digital Banking</h3>
    <div class="main-box">
        <div class="register-text">
          <span class="register-span">Register for a new account,<br></span><span class="join-span">Join our family.</span>
        </div>
        <div class="trust-box">
            <span class="trust-span">Trusted Platform,<br></span><span class="secure-span">Secure Transactions<br></span><span class="simple-span">Simple & Fast</span>
        </div>
    </div>


        <div class="register-container">
            <p class="register-p-text">Create Your Account </p>
            <form method="POST" action="register.php">
                  
            <div class="name-input">
                <i class="fa-solid fa-user input-icon"></i>
                <input type="text" name="name" placeholder="Enter your name" required pattern="[A-Za-z ]+">
            </div>

            <div class="username-input">
                <i class="fa-solid fa-lock input-icon"></i>
                <input type="text" name="username" placeholder=" Enter a Username" required pattern="[a-zA-Z_0-9]+">
            </div>
            <div class="email-input">
                <i class="fa-solid fa-envelope input-icon"></i>
                <input type="email" name="email" placeholder=" Enter your email" required>
            </div>
            <div class="phno-input">
                <i class="fa-solid fa-phone input-icon"></i>
                <input type="tel" name="phno" placeholder=" Enter your phone number" required pattern="[0-9]{10}" maxlength="10">
            </div>
            <div class="password-input">
                <i class="fa-solid fa-lock input-icon"></i>
                <input type="password" name="password" placeholder=" Enter your password" required pattern="[a-zA-Z0-9]{8,}">
            </div>
            <div class="pin-input">
                <i class="fa-solid fa-shield input-icon"></i>
                <input type="password" name="pin" placeholder="Enter a 4 digit pin" required pattern="[0-9]{4}" maxlength="4" inputmode="numeric">

            </div>
            <div class="submit-button">
                <button type="submit">
                    Register
                    <i class="fa-solid fa-right-to-bracket"></i>
                </button>
            </div>
        </form>
            <h4>Already have an account? <a href="../login/">Login here</a></h4>
             </div>
  <h6>© 2026 AdishPay. All rights reserved.</h6>
 </body>
 </html>
